<svg xmlns="http://www.w3.org/2000/svg" width="230" height="220" viewBox="0 0 230 220">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><path d="M42 188 L82 30 H148 L188 188" fill="none" stroke="#6E4A2C" stroke-width="8" stroke-linecap="round"/><path d="M88 36 L82 130 M142 36 L148 130" stroke="#6E4A2C" stroke-width="5"/><rect x="74" y="130" width="84" height="26" rx="12" fill="#FFB6D5" stroke="#6E4A2C" stroke-width="6"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="230" height="220">
