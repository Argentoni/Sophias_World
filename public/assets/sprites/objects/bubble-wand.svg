<svg xmlns="http://www.w3.org/2000/svg" width="90" height="120" viewBox="0 0 90 120">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><path d="M30 104 L56 40" stroke="#6E4A2C" stroke-width="7" stroke-linecap="round"/><circle cx="58" cy="32" r="20" fill="none" stroke="#A0D8F0" stroke-width="7"/><circle cx="28" cy="34" r="8" fill="#CFEFFF" stroke="#6E4A2C" stroke-width="4"/><circle cx="66" cy="72" r="10" fill="#CFEFFF" stroke="#6E4A2C" stroke-width="4"/><circle cx="40" cy="14" r="6" fill="#FAF4E8" stroke="#6E4A2C" stroke-width="3"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="90" height="120">
    <use href="#art-source" fill="#fff" stroke="#fff"/>
  </mask>
  <linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="145%">
    <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#6E4A2C" flood-opacity="0.18"/>
  </filter>
  <filter id="sticker-edge" x="-18%" y="-18%" width="136%" height="136%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="expanded"/>
    <feFlood flood-color="#FFF9EF" flood-opacity="0.95" result="paper"/>
    <feComposite in="paper" in2="expanded" operator="in"/>
  </filter>
</defs>
<use href="#art-source" filter="url(#soft-shadow)"/>
<use href="#art-source" filter="url(#sticker-edge)"/>
<use href="#art-source"/>
<ellipse cx="30.6" cy="21.599999999999998" rx="30.6" ry="24" fill="url(#gloss)" mask="url(#art-mask)" pointer-events="none"/>
</svg>