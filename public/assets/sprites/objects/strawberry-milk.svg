<svg xmlns="http://www.w3.org/2000/svg" width="90" height="110" viewBox="0 0 90 110">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><rect x="24" y="20" width="42" height="76" rx="12" fill="#FFB6D5" stroke="#6E4A2C" stroke-width="6"/><rect x="30" y="8" width="30" height="18" rx="6" fill="#FAF4E8" stroke="#6E4A2C" stroke-width="5"/><path d="M45 48 C35 36 22 46 28 60 C33 72 45 80 45 80 C45 80 57 72 62 60 C68 46 55 36 45 48 Z" fill="#FAF4E8"/><path d="M45 20 L58 2" stroke="#6E4A2C" stroke-width="5" stroke-linecap="round"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="90" height="110">
    <use href="#art-source" fill="#fff" stroke="#fff"/>
  </mask>
  <linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="145%">
    <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#6E4A2C" flood-opacity="0.18"/>
  </filter>
  <filter id="sticker-edge" x="-18%" y="-18%" width="136%" height="136%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="expanded"/>
    <feFlood flood-color="#FFF9EF" flood-opacity="0.95" result="paper"/>
    <feComposite in="paper" in2="expanded" operator="in"/>
  </filter>
</defs>
<use href="#art-source" filter="url(#soft-shadow)"/>
<use href="#art-source" filter="url(#sticker-edge)"/>
<use href="#art-source"/>
<ellipse cx="30.6" cy="19.8" rx="30.6" ry="22" fill="url(#gloss)" mask="url(#art-mask)" pointer-events="none"/>
</svg>