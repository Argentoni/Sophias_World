<svg xmlns="http://www.w3.org/2000/svg" width="100" height="70" viewBox="0 0 100 70">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><path d="M28 28 Q20 14 36 10 Q48 10 50 22 Q52 10 64 10 Q80 14 72 28 L72 42 Q80 56 64 60 Q52 60 50 48 Q48 60 36 60 Q20 56 28 42 Z" fill="#FAF4E8" stroke="#6E4A2C" stroke-width="6"/><circle cx="40" cy="35" r="3" fill="#FFE8A8"/><circle cx="60" cy="35" r="3" fill="#FFE8A8"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="70">
    <use href="#art-source" fill="#fff" stroke="#fff"/>
  </mask>
  <linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="145%">
    <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#6E4A2C" flood-opacity="0.18"/>
  </filter>
  <filter id="sticker-edge" x="-18%" y="-18%" width="136%" height="136%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="expanded"/>
    <feFlood flood-color="#FFF9EF" flood-opacity="0.95" result="paper"/>
    <feComposite in="paper" in2="expanded" operator="in"/>
  </filter>
</defs>
<use href="#art-source" filter="url(#soft-shadow)"/>
<use href="#art-source" filter="url(#sticker-edge)"/>
<use href="#art-source"/>
<ellipse cx="34" cy="12.6" rx="34" ry="14" fill="url(#gloss)" mask="url(#art-mask)" pointer-events="none"/>
</svg>