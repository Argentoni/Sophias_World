<svg xmlns="http://www.w3.org/2000/svg" width="180" height="230" viewBox="0 0 180 230">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><rect x="26" y="24" width="128" height="178" rx="18" fill="#FFB6D5" stroke="#6E4A2C" stroke-width="8"/><path d="M90 28 V198" stroke="#6E4A2C" stroke-width="6"/><circle cx="74" cy="114" r="5" fill="#6E4A2C"/><circle cx="106" cy="114" r="5" fill="#6E4A2C"/><path d="M44 52 Q90 24 136 52" fill="none" stroke="#FAF4E8" stroke-width="7"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="230">
