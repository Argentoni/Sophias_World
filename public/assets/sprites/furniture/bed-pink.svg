<svg xmlns="http://www.w3.org/2000/svg" width="260" height="170" viewBox="0 0 260 170">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="72" width="204" height="70" rx="28" fill="#FFB6D5" stroke="#6E4A2C" stroke-width="8"/><rect x="48" y="42" width="82" height="54" rx="18" fill="#FAF4E8" stroke="#6E4A2C" stroke-width="6"/><path d="M42 142 L42 160 M220 142 L220 160" stroke="#6E4A2C" stroke-width="8" stroke-linecap="round"/><circle cx="188" cy="92" r="22" fill="#FFE8A8"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="260" height="170">
    <use href="#art-source" fill="#fff" stroke="#fff"/>
  </mask>
  <linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="145%">
    <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#6E4A2C" flood-opacity="0.18"/>
  </filter>
  <filter id="sticker-edge" x="-18%" y="-18%" width="136%" height="136%">
