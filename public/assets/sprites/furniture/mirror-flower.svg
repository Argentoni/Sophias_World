<svg xmlns="http://www.w3.org/2000/svg" width="130" height="210" viewBox="0 0 130 210">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="65" cy="92" rx="42" ry="62" fill="#DDEFFC" stroke="#6E4A2C" stroke-width="7"/><g fill="#FFB6D5"><ellipse cx="65" cy="18" rx="13" ry="24"/><ellipse cx="65" cy="166" rx="13" ry="24"/><ellipse cx="16" cy="92" rx="20" ry="12"/><ellipse cx="114" cy="92" rx="20" ry="12"/></g><path d="M65 154 L65 196" stroke="#6E4A2C" stroke-width="7" stroke-linecap="round"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="130" height="210">
    <use href="#art-source" fill="#fff" stroke="#fff"/>
  </mask>
  <linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="145%">
    <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#6E4A2C" flood-opacity="0.18"/>
  </filter>
  <filter id="sticker-edge" x="-18%" y="-18%" width="136%" height="136%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="expanded"/>
    <feFlood flood-color="#FFF9EF" flood-opacity="0.95" result="paper"/>
    <feComposite in="paper" in2="expanded" operator="in"/>
  </filter>
</defs>
<use href="#art-source" filter="url(#soft-shadow)"/>
<use href="#art-source" filter="url(#sticker-edge)"/>
<use href="#art-source"/>
<ellipse cx="44.2" cy="37.8" rx="44.2" ry="42" fill="url(#gloss)" mask="url(#art-mask)" pointer-events="none"/>
</svg>