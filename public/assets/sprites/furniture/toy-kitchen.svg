<svg xmlns="http://www.w3.org/2000/svg" width="180" height="210" viewBox="0 0 180 210">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><rect x="24" y="38" width="132" height="142" rx="18" fill="#FFD7E8" stroke="#6E4A2C" stroke-width="8"/><rect x="42" y="92" width="96" height="58" rx="12" fill="#FAF4E8" stroke="#6E4A2C" stroke-width="6"/><circle cx="60" cy="66" r="8" fill="#A0D8F0"/><circle cx="90" cy="66" r="8" fill="#FFE8A8"/><circle cx="120" cy="66" r="8" fill="#B5E6C5"/><path d="M54 120 H126" stroke="#FFB6D5" stroke-width="7" stroke-linecap="round"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="210">
    <use href="#art-source" fill="#fff" stroke="#fff"/>
  </mask>
  <linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="145%">
    <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#6E4A2C" flood-opacity="0.18"/>
  </filter>
  <filter id="sticker-edge" x="-18%" y="-18%" width="136%" height="136%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="expanded"/>
    <feFlood flood-color="#FFF9EF" flood-opacity="0.95" result="paper"/>
    <feComposite in="paper" in2="expanded" operator="in"/>
  </filter>
</defs>
<use href="#art-source" filter="url(#soft-shadow)"/>
<use href="#art-source" filter="url(#sticker-edge)"/>
<use href="#art-source"/>
<ellipse cx="61.2" cy="37.8" rx="61.2" ry="42" fill="url(#gloss)" mask="url(#art-mask)" pointer-events="none"/>
</svg>