<svg xmlns="http://www.w3.org/2000/svg" width="180" height="205" viewBox="0 0 180 205">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="90" cy="62" rx="42" ry="48" fill="#DDEFFC" stroke="#6E4A2C" stroke-width="7"/><path d="M90 46 C74 28 48 42 56 66 C64 88 90 100 90 100 C90 100 116 88 124 66 C132 42 106 28 90 46 Z" fill="#FFD7E8" opacity="0.7"/><rect x="36" y="112" width="108" height="42" rx="14" fill="#FFB6D5" stroke="#6E4A2C" stroke-width="7"/><path d="M56 154 L46 190 M124 154 L134 190" stroke="#6E4A2C" stroke-width="7" stroke-linecap="round"/><circle cx="90" cy="134" r="7" fill="#FFE8A8"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="205">
    <use href="#art-source" fill="#fff" stroke="#fff"/>
  </mask>
  <linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="145%">
