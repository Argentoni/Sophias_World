<svg xmlns="http://www.w3.org/2000/svg" width="180" height="140" viewBox="0 0 180 140">
<defs>
  <g id="art-source" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="90" cy="72" rx="62" ry="24" fill="#FAF4E8" stroke="#6E4A2C" stroke-width="7"/><path d="M52 92 L42 128 M128 92 L138 128" stroke="#6E4A2C" stroke-width="7" stroke-linecap="round"/><path d="M70 48 H110 L104 72 H76 Z" fill="#FFB6D5" stroke="#6E4A2C" stroke-width="5"/><path d="M104 54 Q128 48 122 68 Q116 80 104 68" fill="none" stroke="#6E4A2C" stroke-width="5"/><circle cx="128" cy="68" r="10" fill="#FFE8A8" stroke="#6E4A2C" stroke-width="5"/></g>
  <mask id="art-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="140">
    <use href="#art-source" fill="#fff" stroke="#fff"/>
  </mask>
  <linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="145%">
    <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#6E4A2C" flood-opacity="0.18"/>
  </filter>
  <filter id="sticker-edge" x="-18%" y="-18%" width="136%" height="136%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="expanded"/>
    <feFlood flood-color="#FFF9EF" flood-opacity="0.95" result="paper"/>
    <feComposite in="paper" in2="expanded" operator="in"/>
  </filter>
</defs>
<use href="#art-source" filter="url(#soft-shadow)"/>
<use href="#art-source" filter="url(#sticker-edge)"/>
<use href="#art-source"/>
<ellipse cx="61.2" cy="25.2" rx="61.2" ry="28" fill="url(#gloss)" mask="url(#art-mask)" pointer-events="none"/>
